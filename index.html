<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #0d0d0d;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.4;
      font-size: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease-in;
    }

    .user {
      align-self: flex-end;
      background-color: #1e90ff;
      color: white;
      border-bottom-right-radius: 0;
    }

    .bot {
      align-self: flex-start;
      background-color: #2b2b2b;
      color: #b0ffb3;
      border-bottom-left-radius: 0;
    }

    #input-area {
      display: flex;
      padding: 12px;
      background-color: #1a1a1a;
      border-top: 1px solid #333;
    }

    #input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: white;
      outline: none;
      transition: background-color 0.2s;
    }

    #input:focus {
      background-color: #333;
    }

    #send {
      margin-left: 10px;
      background-color: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #send:hover {
      background-color: #0077cc;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 4px;
      background-color: #b0ffb3;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.3;
      } 
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div id="chat"></div>

  <div id="input-area">
    <input type="text" id="input" placeholder="Pose ta question..." />
    <button id="send">Envoyer</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const API_KEY = "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";  // Remplacez par votre clé API
    const MODEL = "meta-llama/llama-3.3-8b-instruct:free";
    const ENDPOINT = "https://openrouter.ai/api/v1/chat/completions";

    let history = [];

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.innerText = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return msg;
    }

    function addLoadingMessage() {
      const loading = document.createElement("div");
      loading.className = "message bot";
      loading.innerHTML = `
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      `;
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;
      return loading;
    }

    async function sendMessage() {
      const userText = input.value.trim();
      if (!userText) return;

      addMessage(userText, "user");
      input.value = "";
      input.focus();

      history.push({ role: "user", content: userText });

      const loadingMsg = addLoadingMessage();

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
            "HTTP-Referer": "https://votresite.com",  // Remplacez par l'URL de votre site
            "X-Title": "LLM Chat"  // Remplacez par le nom de votre site
          },
          body: JSON.stringify({
            model: MODEL,
            messages: history
          })
        });

        const data = await response.json();
        const botReply = data.choices[0].message.content;

        loadingMsg.remove();
        addMessage(botReply, "bot");
        history.push({ role: "assistant", content: botReply });

      } catch (error) {
        loadingMsg.remove();
        addMessage("❌ Erreur de réponse", "bot");
        console.error(error);
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
  </html>
